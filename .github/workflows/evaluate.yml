name: Deterministic evaluation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.3'
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q
      - run: uv run python scripts/generate_demo.py
      - name: Validate public report
        run: uv run python scripts/validate_report.py
      - name: Demonstrate regression gate and clean control
        env:
          PYTHONPATH: backend/src
        shell: bash
        run: |
          set +e
          uv run python -m agentguard
          code=$?
          set -e
          test "$code" -eq 1
          uv run python -m agentguard --candidate baseline --output artifacts/control.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-evidence
          path: |
            apps/web/public/data/
            artifacts/
          if-no-files-found: error
          retention-days: 14
